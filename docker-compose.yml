services:
  db:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo-data:/data/db

  ml-client:
    container_name: ml-client

    build: ./machine-learning-client
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    volumes:
      - receipt-uploads:/app/uploads
    depends_on:
      - db

  web-app:
    container_name: web-app
    build: ./web-app
    ports:
      - "5000:5000"
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    volumes:
      - receipt-uploads:/app/uploads
    depends_on:
      - db

volumes:
  mongo-data:
    driver: local
  receipt-uploads:
    driver: local
