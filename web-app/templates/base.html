<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receipt Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">Receipt Scanner</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('upload') }}">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('history') }}">History</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('analytics') }}">Analytics</a></li>
          <li class="nav-item" id="loginNavItem" style="display: none;">
            <a class="nav-link" href="{{ url_for('auth.login_page') }}">Login</a>
          </li>
          <li class="nav-item" id="userNavItem" style="display: none;">
            <span class="navbar-text me-2" id="userEmail"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutButton">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Flash Messages -->
  <div class="container mt-3">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <!-- Page Content -->
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-5">
    <small>Team Six Seven</small>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Auth utility -->
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <!-- Update navbar based on auth status -->
  <script>
    (async function() {
      // Skip auth check on login/signup pages
      const currentPath = window.location.pathname;
      if (currentPath === '/api/auth/login' || currentPath === '/api/auth/signup') {
        // On login/signup pages, always show login button
        const loginNavItem = document.getElementById('loginNavItem');
        const userNavItem = document.getElementById('userNavItem');
        if (loginNavItem) loginNavItem.style.display = 'block';
        if (userNavItem) userNavItem.style.display = 'none';
        return;
      }
      
      try {
        const user = await checkAuthStatus();
        const loginNavItem = document.getElementById('loginNavItem');
        const userNavItem = document.getElementById('userNavItem');
        const userEmail = document.getElementById('userEmail');
        const logoutButton = document.getElementById('logoutButton');
        
        if (user) {
          // User is logged in
          loginNavItem.style.display = 'none';
          userNavItem.style.display = 'block';
          userEmail.textContent = user.email || user.username || 'User';
          
          logoutButton.addEventListener('click', async () => {
            await logout();
          });
        } else {
          // User is not logged in
          loginNavItem.style.display = 'block';
          userNavItem.style.display = 'none';
        }
      } catch (error) {
        // Silently handle errors (user will be redirected by server if needed)
        console.debug('Auth check error:', error);
      }
    })();
  </script>
</body>
</html>
